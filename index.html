<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meteor Strike | Play Web Demo</title>
    <meta
      name="description"
      content="Play the Meteor Strike web demo in your browser, then download the full game on Google Play."
    />
    <meta name="theme-color" content="#08121c" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <section class="hero-copy" aria-label="Meteor Strike by Striking Games">
          <header class="brand">
            <div class="brand__studio">
              <img
                class="brand__mark"
                src="assets/logo_meteor_strike_mark.png"
                alt=""
              />
              <span>Striking Games</span>
            </div>

            <img
              class="brand__logo"
              src="assets/logo_meteor_strike.png"
              alt="Meteor Strike"
            />
          </header>

          <p class="hero-copy__lead">
            Play the web demo instantly, then download the full game on Google Play.
          </p>

          <nav class="action-dock" aria-label="Primary actions">
            <a
              class="cta cta--primary"
              href="https://play.google.com/store/apps/details?id=com.strikinggames.meteorstrike"
              target="_blank"
              rel="noreferrer"
            >
              Download on Google Play
            </a>
            <a
              class="cta cta--secondary"
              href="https://strikinggames.github.io/meteor-strike-privacy/"
              target="_blank"
              rel="noreferrer"
            >
              Privacy Policy
            </a>
          </nav>
        </section>

        <section class="play-area" aria-label="Meteor Strike web demo">
          <div class="phone-frame">
            <div class="phone-screen">
              <div class="game-shell" data-game-root>
                <canvas
                  class="game-canvas"
                  data-game-canvas
                  width="540"
                  height="1170"
                  aria-label="Playable Meteor Strike web demo"
                ></canvas>

                <div class="game-ui">
                  <div class="hud-row">
                    <div class="hud-chip">
                      <span class="hud-label">Score</span>
                      <strong data-game-score>0</strong>
                    </div>

                    <div class="hud-lives" aria-label="Lives remaining">
                      <img class="game-heart" src="assets/icon_heart.png" alt="" />
                      <img class="game-heart" src="assets/icon_heart.png" alt="" />
                      <img class="game-heart" src="assets/icon_heart.png" alt="" />
                    </div>

                    <div class="hud-chip">
                      <span class="hud-label">Best</span>
                      <strong data-game-best>0</strong>
                    </div>
                  </div>

                  <div class="game-tip" data-game-tip>Hold and drag across meteors</div>

                  <div class="game-overlay" data-game-menu>
                    <div class="overlay-card">
                      <p class="overlay-kicker">Loading Demo</p>
                      <h1 class="overlay-title">Meteor Strike</h1>
                      <p class="overlay-copy">Play in the browser, then grab the full version below.</p>
                      <button class="game-button" data-game-start type="button">Loading...</button>
                    </div>
                  </div>

                  <div class="game-overlay" data-game-over hidden>
                    <div class="overlay-card">
                      <p class="overlay-kicker">Run Over</p>
                      <p class="overlay-score" data-game-final-score>Final Score 0</p>
                      <p class="overlay-best" data-game-best-line>Best 0</p>
                      <button class="game-button" data-game-retry type="button">Play Again</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="demo.js"></script>
  </body>
</html>
